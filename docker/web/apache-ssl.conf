# OpensourceERP Apache HTTPS (Port 443)

<VirtualHost *:443>
    ServerName ${DOMAIN}

    SSLEngine on
    SSLCertificateFile /etc/ssl/oserp/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/oserp/privkey.pem

    DocumentRoot /var/www/html/dist

    <Directory /var/www/html/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Kamera-Medien NIE direkt ausliefern – nur ueber den authentifizierten
    # Endpoint /api/camera/media.php. Liegen seit der Umstellung ohnehin in
    # backend/data/ (ausserhalb des DocumentRoots); diese Regel ist eine
    # zusaetzliche Absicherung gegen versehentlich kopierte Build-Artefakte.
    RedirectMatch 404 ^/camera-(snapshots|clips)/

    # SSE-Server Reverse Proxy
    ProxyPass /sse/ http://127.0.0.1:3001/
    ProxyPassReverse /sse/ http://127.0.0.1:3001/

    Alias /api /var/www/html/backend/api

    <Directory /var/www/html/backend/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://127.0.0.1:9000"
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/backend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://127.0.0.1:9000"
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/backend/config>
        Require all denied
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog /var/log/apache2/oserp_ssl_error.log
    CustomLog /var/log/apache2/oserp_ssl_access.log combined
</VirtualHost>
