; OpensourceERP PHP-Konfiguration (Docker Production)

upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300
memory_limit = 256M

display_errors = Off
log_errors = On
error_log = /var/www/html/backend/log/php_error.log

date.timezone = Europe/Berlin

session.cookie_samesite = Strict
session.cookie_httponly = 1
; cookie_secure wird vom Entrypoint gesetzt (1 mit SSL, 0 ohne SSL)
