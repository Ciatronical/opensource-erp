# OpensourceERP Apache HTTP (Port 80)

<VirtualHost *:80>
    ServerName ${DOMAIN}

    # ACME Challenge fuer Certbot
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    # Wenn SSL-Zertifikat existiert: alles andere zu HTTPS umleiten
    RewriteEngine On
    RewriteCond /etc/ssl/oserp/fullchain.pem -f
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]

    # App ueber HTTP (wenn kein SSL)
    DocumentRoot /var/www/html/dist

    <Directory /var/www/html/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Kamera-Medien NIE direkt ausliefern – nur ueber den authentifizierten
    # Endpoint /api/camera/media.php. Liegen seit der Umstellung ohnehin in
    # backend/data/ (ausserhalb des DocumentRoots); diese Regel ist eine
    # zusaetzliche Absicherung gegen versehentlich kopierte Build-Artefakte.
    RedirectMatch 404 ^/camera-(snapshots|clips)/

    # SSE-Server Reverse Proxy
    ProxyPass /sse/ http://127.0.0.1:3001/
    ProxyPassReverse /sse/ http://127.0.0.1:3001/

    Alias /api /var/www/html/backend/api

    <Directory /var/www/html/backend/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://127.0.0.1:9000"
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/backend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://127.0.0.1:9000"
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/backend/config>
        Require all denied
    </Directory>

    ErrorLog /var/log/apache2/oserp_error.log
    CustomLog /var/log/apache2/oserp_access.log combined
</VirtualHost>
