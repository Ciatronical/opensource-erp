{{- /*
  {{< shop-register >}}
  {{< shop-register redirect-url="/registriert/" login-url="/login/" >}}

  mode="guest" ist fuer die Einbettung in <shop-checkout> gedacht und wird
  dort programmatisch gesetzt — als Shortcode normalerweise nicht noetig.
*/ -}}
{{- partial "shop-ui-assets.html" . -}}
<shop-register
  {{- with .Get `redirect-url` }} redirect-url="{{ . }}"{{ end }}
  {{- with .Get `login-url` }} login-url="{{ . }}"{{ end }}
  {{- with .Get `data-protection-url` }} data-protection-url="{{ . }}"{{ end }}
  {{- with .Get `mode` }} mode="{{ . }}"{{ end }}
  {{- with .Get `heading` }} heading="{{ . }}"{{ end }}
  {{- with .Get `class` }} class="{{ . }}"{{ end }}></shop-register>
