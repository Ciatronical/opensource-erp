{{- /*
  {{< shop-account-buttons >}}

  Die Kopf-Knoepfe als Shortcode — im Regelfall steht das Element direkt im
  Kopf-Partial der Instanz, nicht im Inhalt. Nuetzlich zum Ausprobieren.
*/ -}}
{{- partial "shop-ui-assets.html" . -}}
<shop-account-buttons
  {{- with .Get `login-url` }} login-url="{{ . }}"{{ end }}
  {{- with .Get `logout-url` }} logout-url="{{ . }}"{{ end }}
  {{- with .Get `register-url` }} register-url="{{ . }}"{{ end }}
  {{- with .Get `account-url` }} account-url="{{ . }}"{{ end }}
  {{- with .Get `cart-url` }} cart-url="{{ . }}"{{ end }}
  {{- with .Get `class` }} class="{{ . }}"{{ end }}></shop-account-buttons>
