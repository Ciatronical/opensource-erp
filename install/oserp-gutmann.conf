# Hella Gutmann mega macs X in LxCars — Weiterleitung der Geräteoberfläche
# (docs/features/gutmann.md). Wird von install/gutmann-proxy.sh in den
# HTTPS-vHost eingebunden; OSERP_GUTMANN_DEVICE kommt aus
# conf-available/oserp-gutmann-defines.conf (z. B. 192.168.178.217:8889).
#
# Reihenfolge wichtig: die WebSocket-Regel steht vor der allgemeinen, Apache
# nimmt die erste passende ProxyPass-Zeile.
<IfDefine OSERP_GUTMANN_DEVICE>
    RedirectMatch ^/gutmann$ /gutmann/

    ProxyPass        /gutmann/ws ws://${OSERP_GUTMANN_DEVICE}/ retry=0
    ProxyPassReverse /gutmann/ws ws://${OSERP_GUTMANN_DEVICE}/
    ProxyPass        /gutmann/   http://${OSERP_GUTMANN_DEVICE}/ retry=0 timeout=10
    ProxyPassReverse /gutmann/   http://${OSERP_GUTMANN_DEVICE}/

    <Location /gutmann/>
        # Von überall erreichbar (Werkstatt-Tablet, Handy, Homeoffice) — aber
        # nur mit OSERP-Anmeldung: Das Gerät hat keine eigene, darum verlangt
        # Apache das Cookie oserp_gutmann mit dem Geheimnis aus
        # oserp-gutmann-defines.conf. Setzen tut es die API-Aktion
        # getGutmannAccess (backend/api/lxcars/gutmann.php), die nur mit
        # gültiger Sitzung läuft. Ohne Cookie: 403.
        Require all granted
        RewriteEngine On
        RewriteCond %{HTTP_COOKIE} !(^|;\s*)oserp_gutmann=${OSERP_GUTMANN_TOKEN}(;|$)
        RewriteRule ^ - [F]

        # Geräteadresse für den Notfallknopf in LxCars (öffnet das Gerät direkt,
        # wenn die Weiterleitung nicht geht) — auch bei Fehlerantworten (503).
        Header always set X-Gutmann-Device "${OSERP_GUTMANN_DEVICE}"

        # Startseite unkomprimiert anfordern, damit mod_substitute die
        # Brücke (public/gutmann-bridge.js|css) einhängen kann. Die
        # Skript-/Stylesheet-Pakete des Geräts liegen fest komprimiert vor und
        # werden davon nicht berührt.
        RequestHeader unset Accept-Encoding
        AddOutputFilterByType SUBSTITUTE text/html
        Substitute "s|<head>|<head><script src=\"/gutmann-bridge.js\"></script>|i"
        Substitute "s|</head>|<link rel=\"stylesheet\" href=\"/gutmann-bridge.css\"></head>|i"
    </Location>
</IfDefine>
