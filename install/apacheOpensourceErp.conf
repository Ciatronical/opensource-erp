# =============================================================================
#  OpensourceERP — Apache vHost (Vorlage, versions- und pfadunabhängig)
# =============================================================================
#  Diese Datei enthält KEINE hardcodierten Versionen oder Pfade mehr.
#  Sie referenziert zwei Apache-Variablen, die der Installer automatisch
#  ermittelt und in /etc/apache2/conf-available/oserp-defines.conf schreibt:
#
#      Define OSERP_ROOT     /pfad/zur/opensource-erp      (Installationspfad)
#      Define OSERP_PHP_FPM  /run/php/phpX.Y-fpm.sock      (aktiver FPM-Socket)
#
#  Der Socket wird zur Laufzeit aus der installierten PHP-Version abgeleitet
#  (siehe install/install.sh -> detect_php_fpm_socket). Dadurch muss beim
#  Wechsel der PHP-Version (8.1 -> 8.3 -> 9.0 ...) NICHTS hier angepasst werden.
#
#  Manueller Test der Defines (ohne Installer):
#      Define OSERP_ROOT /home/work/opensource-erp
#      Define OSERP_PHP_FPM /run/php/php8.3-fpm.sock
# =============================================================================
<VirtualHost *:80>
    ServerName localhost

    # Vue.js Frontend (dist Ordner)
    DocumentRoot ${OSERP_ROOT}/dist

    <Directory ${OSERP_ROOT}/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Vue Router: alle Anfragen zu index.html umleiten
        FallbackResource /index.html
    </Directory>

    # SSE-Server Reverse Proxy (Echtzeit-Benachrichtigungen)
    ProxyPass /sse/ http://127.0.0.1:3001/
    ProxyPassReverse /sse/ http://127.0.0.1:3001/

    # WhatsApp Webhook (kein Session-Check - Meta sendet keine Cookies!)
    Alias /webhook ${OSERP_ROOT}/backend/webhook

    <Directory ${OSERP_ROOT}/backend/webhook>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex whatsapp.php

        <FilesMatch \.php$>
            SetHandler "proxy:unix:${OSERP_PHP_FPM}|fcgi://localhost"
        </FilesMatch>
    </Directory>

    # PHP Backend API
    Alias /api ${OSERP_ROOT}/backend/api

    <Directory ${OSERP_ROOT}/backend/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        <FilesMatch \.php$>
            SetHandler "proxy:unix:${OSERP_PHP_FPM}|fcgi://localhost"
        </FilesMatch>
    </Directory>

    # Ganzes Backend-Verzeichnis (falls andere Pfade benötigt werden)
    <Directory ${OSERP_ROOT}/backend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <FilesMatch \.php$>
            SetHandler "proxy:unix:${OSERP_PHP_FPM}|fcgi://localhost"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/opensourceerp_error.log
    CustomLog ${APACHE_LOG_DIR}/opensourceerp_access.log combined
</VirtualHost>
