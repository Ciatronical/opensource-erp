# =============================================================================
#  OpensourceERP — Apache vHost (Vorlage, versions- und pfadunabhängig)
# =============================================================================
#  Diese Datei enthält KEINE hardcodierten Versionen, Pfade oder Hostnamen.
#  Sie referenziert Apache-Variablen, die der Installer automatisch ermittelt
#  und in /etc/apache2/conf-available/oserp-defines.conf schreibt:
#
#      Define OSERP_ROOT         /pfad/zur/opensource-erp   (Installationspfad)
#      Define OSERP_PHP_FPM      /run/php/phpX.Y-fpm.sock   (aktiver FPM-Socket)
#      Define OSERP_SERVER_NAME  isolierglas.spdns.de       (öffentlicher Name,
#                                                            sonst "localhost")
#      Define OSERP_TLS                                     (nur gesetzt, wenn
#                                                            Schritt "tls" ein
#                                                            Zertifikat hat)
#
#  Der Socket wird zur Laufzeit aus der installierten PHP-Version abgeleitet
#  (siehe install/install.sh -> detect_php_fpm_socket). Dadurch muss beim
#  Wechsel der PHP-Version (8.1 -> 8.3 -> 9.0 ...) NICHTS hier angepasst werden.
#
#  Der eigentliche Inhalt (DocumentRoot, /api, /webhook, /sse) liegt EINMAL in
#  apacheOpensourceErp-common.conf (vom Installer nach
#  /etc/apache2/oserp-site-common.conf kopiert) und wird in beide Blöcke
#  eingebunden.
#
#  Manueller Test der Defines (ohne Installer):
#      Define OSERP_ROOT /home/work/opensource-erp
#      Define OSERP_PHP_FPM /run/php/php8.3-fpm.sock
#      Define OSERP_SERVER_NAME localhost
# =============================================================================
<VirtualHost *:80>
    ServerName ${OSERP_SERVER_NAME}
    ServerAlias localhost

    # Sobald ein Zertifikat da ist: Aufrufe über den öffentlichen Namen auf
    # HTTPS umleiten. Aufrufe per LAN-IP/localhost bleiben auf HTTP (dafür gibt
    # es kein Zertifikat), die ACME-Challenge von certbot bleibt ebenfalls frei.
    <IfDefine OSERP_TLS>
        RewriteEngine on
        RewriteCond %{HTTP_HOST} =${OSERP_SERVER_NAME}
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
    </IfDefine>

    # Let's-Encrypt-Challenge (Schritt "tls"): eigener Webroot außerhalb von
    # dist/, damit der Vite-Build nicht über root-eigene Dateien stolpert.
    Alias /.well-known/acme-challenge/ /var/lib/oserp/acme/.well-known/acme-challenge/
    <Directory /var/lib/oserp/acme/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    Include oserp-site-common.conf

    ErrorLog ${APACHE_LOG_DIR}/opensourceerp_error.log
    CustomLog ${APACHE_LOG_DIR}/opensourceerp_access.log combined
</VirtualHost>

# HTTPS — wird nur aktiv, wenn der Installer-Schritt "tls" ein Let's-Encrypt-
# Zertifikat geholt und "Define OSERP_TLS" in oserp-defines.conf geschrieben hat.
<IfDefine OSERP_TLS>
<IfModule ssl_module>
<VirtualHost *:443>
    ServerName ${OSERP_SERVER_NAME}

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/${OSERP_SERVER_NAME}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${OSERP_SERVER_NAME}/privkey.pem
    # Mozilla "intermediate" (entspricht certbots options-ssl-apache.conf)
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    Include oserp-site-common.conf

    ErrorLog ${APACHE_LOG_DIR}/opensourceerp_error.log
    CustomLog ${APACHE_LOG_DIR}/opensourceerp_access.log combined
</VirtualHost>
</IfModule>
</IfDefine>
