<VirtualHost *:80>
    ServerName localhost

    # Vue.js Frontend (dist Ordner)
    DocumentRoot /home/work/opensource-erp/dist

    <Directory /home/work/opensource-erp/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Vue Router: alle Anfragen zu index.html umleiten
        FallbackResource /index.html
    </Directory>

    # SSE-Server Reverse Proxy (Echtzeit-Benachrichtigungen)
    ProxyPass /sse/ http://127.0.0.1:3001/
    ProxyPassReverse /sse/ http://127.0.0.1:3001/

    # WhatsApp Webhook (kein Session-Check - Meta sendet keine Cookies!)
    Alias /webhook /home/work/opensource-erp/backend/webhook

    <Directory /home/work/opensource-erp/backend/webhook>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex whatsapp.php

        <FilesMatch \.php$>
            SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    # PHP Backend API
    Alias /api /home/work/opensource-erp/backend/api

    <Directory /home/work/opensource-erp/backend/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        <FilesMatch \.php$>
            SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    # Ganzes Backend-Verzeichnis (falls andere Pfade benötigt werden)
    <Directory /home/work/opensource-erp/backend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <FilesMatch \.php$>
            SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/opensourceerp_error.log
    CustomLog ${APACHE_LOG_DIR}/opensourceerp_access.log combined
</VirtualHost>