# =============================================================================
#  OpensourceERP — gemeinsamer vHost-Rumpf für HTTP (:80) und HTTPS (:443)
# =============================================================================
#  Wird vom Installer nach /etc/apache2/oserp-site-common.conf kopiert und von
#  apacheOpensourceErp.conf in beiden <VirtualHost>-Blöcken per Include geladen.
#  Dadurch gibt es die Pfade/Handler nur EINMAL — HTTPS ist keine Kopie.
#
#  Benötigte Defines (schreibt install/install.sh nach
#  /etc/apache2/conf-available/oserp-defines.conf):
#      OSERP_ROOT      Installationspfad
#      OSERP_PHP_FPM   aktiver PHP-FPM-Socket
# =============================================================================

# Vue.js Frontend (dist Ordner)
DocumentRoot ${OSERP_ROOT}/dist

<Directory ${OSERP_ROOT}/dist>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    # Vue Router: alle Anfragen zu index.html umleiten
    # (echte Dateien — auch /.well-known/acme-challenge/* von certbot — werden
    #  direkt ausgeliefert, FallbackResource greift nur bei fehlenden Dateien)
    FallbackResource /index.html
</Directory>

# SSE-Server Reverse Proxy (Echtzeit-Benachrichtigungen)
ProxyPass /sse/ http://127.0.0.1:3001/
ProxyPassReverse /sse/ http://127.0.0.1:3001/

# WhatsApp Webhook (kein Session-Check - Meta sendet keine Cookies!)
Alias /webhook ${OSERP_ROOT}/backend/webhook

<Directory ${OSERP_ROOT}/backend/webhook>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex whatsapp.php

    <FilesMatch \.php$>
        SetHandler "proxy:unix:${OSERP_PHP_FPM}|fcgi://localhost"
    </FilesMatch>
</Directory>

# PHP Backend API
Alias /api ${OSERP_ROOT}/backend/api

<Directory ${OSERP_ROOT}/backend/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php

    <FilesMatch \.php$>
        SetHandler "proxy:unix:${OSERP_PHP_FPM}|fcgi://localhost"
    </FilesMatch>
</Directory>

# Ganzes Backend-Verzeichnis (falls andere Pfade benötigt werden)
<Directory ${OSERP_ROOT}/backend>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    <FilesMatch \.php$>
        SetHandler "proxy:unix:${OSERP_PHP_FPM}|fcgi://localhost"
    </FilesMatch>
</Directory>
