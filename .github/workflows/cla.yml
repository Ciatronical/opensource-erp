# CLA-Assistent: fordert bei jedem Pull Request die Unterschrift unter CLA.md ein
# und blockiert den Merge, bis sie vorliegt. Unterschriften werden in
# .github/cla-signatures.json auf dem Branch main gespeichert.
#
# Hinweis: Ist der Branch main geschützt, kann der Workflow mit GITHUB_TOKEN
# nicht auf ihn schreiben. Dann ein Personal Access Token (Scope "repo") als
# Secret CLA_TOKEN anlegen und unten PERSONAL_ACCESS_TOKEN einkommentieren,
# oder die Unterschriften über `remote-repository-name` in ein eigenes
# Repository auslagern (siehe https://github.com/contributor-assistant/github-action).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA-Assistent
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/Ciatronical/opensource-erp/blob/main/CLA.md'
          branch: 'main'
          allowlist: dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >-
            Vielen Dank für den Beitrag. Bevor wir ihn annehmen können, benötigen wir
            Ihre Unterschrift unter dem [Contributor License Agreement](https://github.com/Ciatronical/opensource-erp/blob/main/CLA.md).
            Bitte lesen Sie das Dokument und antworten Sie mit folgendem Kommentar:
          custom-allsigned-prcomment: 'Alle Beitragenden haben das CLA unterschrieben. Vielen Dank.'
          lock-pullrequest-aftermerge: false
